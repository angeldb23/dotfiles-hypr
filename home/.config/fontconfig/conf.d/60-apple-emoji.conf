<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias binding="same"><family>sans-serif</family><append><family>Apple Color Emoji</family></append></alias>
  <alias binding="same"><family>serif</family><append><family>Apple Color Emoji</family></append></alias>
  <alias binding="same"><family>monospace</family><append><family>Apple Color Emoji</family></append></alias>
  <alias binding="same"><family>system-ui</family><append><family>Apple Color Emoji</family></append></alias>
</fontconfig>
