# BACKGROUND
background {
    monitor =
    path = /home/angel/.cache/lockbg/Concept-Japanese house_1366x768_s2.jpg
    blur_passes = 0
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(LC_ALL=C date +"%H:%M")</span>"
    color = rgba(221, 242, 125, 0.9)
    font_size = 154
    font_family = steelfish outline regular
    position = 0, 131
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(LC_ALL=C date +"%A, %B %d")"
    color = rgba(235, 219, 178, .7)
    font_size = 20
    font_family = SF Pro Display Bold
    position = 0, 257
    halign = center
    valign = center
}


# USER
label {
    monitor =
    text =     $USER
    color = rgba(235, 219, 178, 0.80)
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 13
    font_family = SF Pro Display Bold
    position = 0, -128
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 213, 43
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <i><span foreground="##ffffff99">🔒 Enter Pass</span></i>
    hide_input = false
    position = 0, -178
    halign = center
    valign = center
}